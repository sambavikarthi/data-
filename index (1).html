<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Analytics Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
  background:linear-gradient(135deg,#111827,#020617);
  color:#e2e8f0;
}

.navbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 40px;background:#020617;border-bottom:1px solid #334155;
}
.navbar h2{color:#10b981}
.navbar button{
  margin-left:10px;padding:8px 16px;border:none;border-radius:20px;
  background:#1f2937;color:#e2e8f0;cursor:pointer
}
.navbar button.active,.navbar button:hover{
  background:#10b981;color:#000
}

.container{max-width:1200px;margin:auto;padding:20px}
.section{display:none}
.section.active{display:block}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.kpi-box{
  background:#020617;padding:20px;border-radius:12px;text-align:center;border:1px solid #334155
}
.kpi-box h2{color:#10b981}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px}

.card{
  background:#020617;padding:20px;border-radius:12px;border:1px solid #334155
}

h3{margin-bottom:10px;color:#10b981}

.movie{
  background:#1f2937;padding:10px;border-radius:8px;margin-bottom:10px
}

canvas{max-height:220px}

</style>
</head>

<body>

<div class="navbar">
<h2>🎬 Movie Dashboard</h2>
<div>
<button onclick="showSection('dashboard',this)" class="active">Overview</button>
<button onclick="showSection('movies',this)">Movies</button>
<button onclick="showSection('analytics',this)">Analytics</button>
<button onclick="showSection('insights',this)">Insights</button>
</div>
</div>

<div class="container">

<div id="dashboard" class="section active">
<div class="kpi">
<div class="kpi-box"><h2 id="total"></h2><p>Total Movies</p></div>
<div class="kpi-box"><h2 id="avg"></h2><p>Average Rating</p></div>
<div class="kpi-box"><h2 id="top"></h2><p>Top Rating</p></div>
</div>

<div class="grid">
<div class="card"><h3>Movie Ratings </h3><canvas id="barChart"></canvas></div>
<div class="card"><h3>Genre Distribution </h3><canvas id="pieChart"></canvas></div>
</div>
</div>

<div id="movies" class="section">
<div class="card"><h3>Movie Collection</h3><div id="movieList"></div></div>
</div>

<div id="analytics" class="section">
<div class="grid">
<div class="card"><h3>Rating Trend </h3><canvas id="lineChart"></canvas></div>
<div class="card"><h3>Rating Spread </h3><canvas id="scatterChart"></canvas></div>
<div class="card"><h3>Movie Duration </h3><canvas id="durationChart"></canvas></div>
</div>
</div>

<div id="insights" class="section">
<div class="grid">
<div class="card"><h3>Insight Summary</h3><p id="insight"></p></div>
<div class="card"><h3>Top Rated Movies</h3><ul id="topMovies"></ul></div>
<div class="card"><h3>Genre vs Rating </h3><canvas id="genreRatingChart"></canvas></div>
</div>
</div>

</div>

<script>
const movies=[
{title:"Inception",genre:"Sci-Fi",rating:8.8,duration:148},
{title:"Titanic",genre:"Romance",rating:7.9,duration:195},
{title:"Avengers",genre:"Action",rating:8.0,duration:143},
{title:"Interstellar",genre:"Sci-Fi",rating:8.6,duration:169},
{title:"Joker",genre:"Drama",rating:8.4,duration:122},
{title:"Frozen",genre:"Animation",rating:7.5,duration:102},
{title:"Dark Knight",genre:"Action",rating:9.0,duration:152}
];

function showSection(id,btn){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.navbar button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
}

const avg=(movies.reduce((a,b)=>a+b.rating,0)/movies.length).toFixed(1);
document.getElementById("total").textContent=movies.length;
document.getElementById("avg").textContent=avg;
document.getElementById("top").textContent=Math.max(...movies.map(m=>m.rating));

const movieList=document.getElementById("movieList");
movies.forEach(m=>{
let div=document.createElement("div");
div.className="movie";
div.innerHTML=`<b>${m.title}</b><br>${m.genre} • ⭐ ${m.rating} • ⏱ ${m.duration}`;
movieList.appendChild(div);
});

let insightText = avg>8 ? "Excellent audience response." : "Moderate ratings.";
document.getElementById("insight").textContent=insightText;

movies.sort((a,b)=>b.rating-a.rating).slice(0,3).forEach(m=>{
let li=document.createElement("li");
li.textContent=`${m.title} (${m.rating})`;
document.getElementById("topMovies").appendChild(li);
});

const labels=movies.map(m=>m.title);
const ratings=movies.map(m=>m.rating);
const durations=movies.map(m=>m.duration);

let gCount={},gRating={},gNum={};
movies.forEach(m=>{
 gCount[m.genre]=(gCount[m.genre]||0)+1;
 gRating[m.genre]=(gRating[m.genre]||0)+m.rating;
 gNum[m.genre]=(gNum[m.genre]||0)+1;
});
Object.keys(gRating).forEach(g=>gRating[g]/=gNum[g]);

new Chart(document.getElementById("barChart"),{
 type:'bar',
 data:{labels:labels,datasets:[{label:"Ratings",data:ratings,backgroundColor:'#10b981'}]}
});

new Chart(document.getElementById("pieChart"),{
 type:'pie',
 data:{labels:Object.keys(gCount),datasets:[{label:"Genres",data:Object.values(gCount),backgroundColor:['#10b981','#3b82f6','#f43f5e','#a855f7']}]}
});

new Chart(document.getElementById("lineChart"),{
 type:'line',
 data:{labels:labels,datasets:[{label:"Rating Trend",data:ratings,borderColor:'#3b82f6'}]}
});

new Chart(document.getElementById("scatterChart"),{
 type:'scatter',
 data:{datasets:[{label:"Rating Spread",data:ratings.map((r,i)=>({x:i+1,y:r})),backgroundColor:'#f43f5e'}]}
});

new Chart(document.getElementById("durationChart"),{
 type:'bar',
 data:{labels:labels,datasets:[{label:"Duration",data:durations,backgroundColor:'#a855f7'}]}
});

new Chart(document.getElementById("genreRatingChart"),{
 type:'line',
 data:{labels:Object.keys(gRating),datasets:[{label:"Avg Genre Rating",data:Object.values(gRating),borderColor:'#10b981'}]}
});

</script>
</body>
</html>
